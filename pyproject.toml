[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-mcp-rag"
version = "2.0.0"
description = "MCP + RAG agent with semantic knowledge and tool retrieval"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2.0.0,<3",
  "openai>=1.60.0",
  "python-dotenv>=1.0.1",
  "numpy>=1.26.0",
  "rich>=13.9.0",
  "pydantic>=2.9.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.32.0",
  "sqlglot>=25.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
llm-mcp-rag = "src.main:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools]
packages = ["src"]
